<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin SOS Venezuela | ACURA Brasil</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <h2>SOS Venezuela</h2>
                <small>Painel de operação</small>
            </div>
            <ul class="admin-nav" id="admin-nav">
                <li><button type="button" data-tab="dashboard" class="active">Dashboard</button></li>
                <li><button type="button" data-tab="intakes">Solicitudes</button></li>
                <li><button type="button" data-tab="schedule">Escala</button></li>
                <li><button type="button" data-tab="templates">Turnos</button></li>
                <li><button type="button" data-tab="volunteers">Voluntários</button></li>
                <li><button type="button" data-tab="divulgacao">Divulgação <span id="nav-hub-badge" class="admin-nav-badge">0/4</span></button></li>
                <li><button type="button" data-tab="config">Configurações</button></li>
            </ul>
            <div class="admin-sidebar-footer">
                <span id="admin-user-label">—</span>
                <button type="button" class="admin-btn admin-btn-sm admin-btn-secondary" id="admin-logout" style="margin-top:0.5rem;width:100%">Sair</button>
            </div>
        </aside>
        <main class="admin-main" id="admin-main">
            <p>Carregando…</p>
        </main>
    </div>
    <script src="/js/admin/admin-app.js"></script>
</body>
</html>
